<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRINCE-DU-LOVE ❤️</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: white;
      text-align: center;
    }

    .container {
      padding: 30px;
      max-width: 600px;
    }

    .heart {
      font-size: 80px;
      animation: beat 1s infinite;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 15px;
    }

    p {
      font-size: 19px;
      line-height: 1.6;
    }

    button {
      padding: 15px 28px;
      border: none;
      border-radius: 30px;
      background: white;
      color: #e84373;
      font-size: 18px;
      cursor: pointer;
    }

    #message {
      display: none;
      margin-top: 25px;
      font-size: 20px;
      font-weight: bold;
    }

    @keyframes beat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.2);
      }
    }
  </style></head><body>
  <main class="container">
    <div class="heart">❤️</div><h1>PRINCE-DU-LOVE</h1>

<p>
  Bienvenue dans mon univers romantique. 💕<br>
  L'amour rend chaque moment plus beau.
</p>

<button onclick="showLove()">Clique ici ❤️</button>

<p id="message">
  💖 Tu es une personne spéciale. Que l'amour illumine toujours ton cœur ! 💖
</p>

  </main>  <script>
    function showLove() {
      document.getElementById("message").style.display = "block";
    }
  </script></body>
</html>
