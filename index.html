<!DOCTYPE html><html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PRINCE-DU-LOVE ❤️</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff758c, #ff7eb3);
      color: white;
      text-align: center;
    }

    .container {
      padding: 30px;
      max-width: 600px;
    }

    .heart {
      font-size: 80px;
      animation: beat 1s infinite;
    }

    h1 {
      font-size: 38px;
      margin-bottom: 15px;
    }

    p {
      font-size: 19px;
      line-height: 1.6;
    }

    button {
      padding: 15px 28px;
      border: none;
      border-radius: 30px;
      background: white;
      color: #e84373;
      font-size: 18px;
      cursor: pointer;
    }

    #message {
      display: none;
      margin-top: 25px;
      font-size: 20px;
      font-weight: bold;
    }

    @keyframes beat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.2);
      }
    }
  </style></head><body>
  <main class="container">
    <div class="heart">❤️</div><h1>PRINCE-DU-LOVE</h1>

<p>
  Bienvenue dans mon univers romantique. 💕<br>
  L'amour rend chaque moment plus beau.
</p>

<button onclick="showLove()">Clique ici ❤️</button>

<p id="message" style="display:none;">
  💖 Tu es une personne spéciale. Que l'amour illumine toujours ton cœur ! 💖
</p>
<section id="inscription">
  <h2>Créer mon compte ❤️</h2>

  <form id="signupForm">

    <label>Prénom :</label>
    <input type="text" id="prenom" placeholder="Ton prénom" required>

    <label>Pays :</label>
    <input type="text" id="pays" placeholder="Ton pays" required>

    <label>Date de naissance :</label>
    <input type="date" id="naissance" required>

    <label>Adresse e-mail :</label>
    <input type="email" id="email" placeholder="Ton e-mail" required>

    <label>Mot de passe :</label>
    <input type="password" id="password" placeholder="Créer un mot de passe" required minlength="8">

    <label>
      <input type="checkbox" id="majeur" required>
      Je confirme avoir au moins 18 ans.
    </label>

    <button type="submit">Créer mon compte</button>

  </form>
</section>
  </main>  <script>
function showLove() {
    document.getElementById("message").style.display = "block";
}
  </script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://rpseseetttsdyvomamrx.supabase.co";
const SUPABASE_KEY = "sb_publishable_Axy2TsuWpiXXwxkdBBSiGQ_eDbOHEHE";

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

console.log("PRINCE-DU-LOVE connecté à Supabase !");
  document.getElementById("signupForm").addEventListener("submit", async function(event) {
    event.preventDefault();

    const prenom = document.getElementById("prenom").value;
    const pays = document.getElementById("pays").value;
    const naissance = document.getElementById("naissance").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const majeur = document.getElementById("majeur").checked;

    const dateNaissance = new Date(naissance + "T00:00:00");
    const aujourdHui = new Date();

    let age = aujourdHui.getFullYear() - dateNaissance.getFullYear();
    const mois = aujourdHui.getMonth() - dateNaissance.getMonth();

    if (mois < 0 || (mois === 0 && aujourdHui.getDate() < dateNaissance.getDate())) {
        age--;
    }

    if (age < 18 || !majeur) {
        alert("Inscription réservée aux personnes de 18 ans et plus.");
        return;
    }

    const { data, error } = await supabaseClient.auth.signUp({
    email: email,
    password: password,
    options: {
        data: {
            prenom: prenom,
            pays: pays,
            date_naissance: naissance
        }
    }
});

    if (error) {
        alert("Erreur : " + error.message);
    } else {
        alert("Inscription envoyée ! Vérifie ta boîte e-mail.");
    }
});
</script></body>
</html>
